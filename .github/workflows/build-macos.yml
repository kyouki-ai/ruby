name: Build macOS release

# Builds the macOS app whenever a version tag is pushed (the same tags used
# for the manual Windows release) and attaches it to that tag's GitHub
# release - created here if it doesn't exist yet, or appended to if the
# Windows build already created it. This exists because macOS builds can
# only be produced on macOS itself (electron-builder doesn't support
# cross-compiling a signable .dmg from Windows/Linux), and no Mac is
# available for local packaging.
#
# The app is NOT code-signed or notarized (no Apple Developer account is
# configured) - on first launch, macOS Gatekeeper will say the app "is
# damaged" or "can't be verified". Right-click the app -> Open (or
# System Settings -> Privacy & Security -> "Open Anyway") gets past this;
# it's a one-time step per install.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach the build to (only needed for a manual run - a tag push already knows its own tag)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build macOS app (.dmg + .zip)
        run: npm run dist:mac

      # Kept independently of the release-upload step below so a manual
      # verification run (no target release/tag yet) still leaves something
      # retrievable via `gh run download` instead of the build just
      # vanishing with the runner once the job ends.
      - name: Save build as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            desktop/release/*.dmg
            desktop/release/*-mac.zip

      - name: Upload to GitHub release
        if: github.event_name == 'push' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            desktop/release/*.dmg
            desktop/release/*-mac.zip
