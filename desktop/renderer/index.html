<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>Ruby</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="onboarding" class="onboarding">
    <div class="onboarding-step" data-step="welcome">
      <img class="onboarding-mark" src="icon.png" alt="" />
      <h1 class="onboarding-title">Ruby</h1>
      <p class="onboarding-subtitle" data-i18n="onboarding.welcome.subtitle"></p>
      <button class="primary-btn" id="welcome-next-btn" data-i18n="onboarding.welcome.start"></button>
    </div>

    <div class="onboarding-step" data-step="api-key">
      <h2 class="onboarding-heading" data-i18n="onboarding.apiKey.heading"></h2>
      <p class="onboarding-text" data-i18n="onboarding.apiKey.text"></p>
      <ol class="onboarding-steps-list">
        <li data-i18n-html="onboarding.apiKey.step1"></li>
        <li data-i18n-html="onboarding.apiKey.step2"></li>
        <li data-i18n="onboarding.apiKey.step3"></li>
      </ol>
      <a class="secondary-btn onboarding-open-link" href="https://aistudio.google.com/apikey" target="_blank" data-i18n="onboarding.apiKey.openLink">
      </a>
      <div class="onboarding-key-row">
        <input id="onboarding-key-input" type="password" data-i18n-placeholder="onboarding.apiKey.inputPlaceholder" />
      </div>
      <span id="onboarding-error" class="hint" style="color:var(--danger)"></span>
      <div class="onboarding-actions">
        <button class="ghost-btn onboarding-skip" data-i18n="common.skip"></button>
        <button class="primary-btn" id="onboarding-save-btn" data-i18n="common.done"></button>
      </div>
    </div>

    <div class="onboarding-step" data-step="done">
      <div class="onboarding-check"></div>
      <h2 class="onboarding-heading" data-i18n="onboarding.done.heading"></h2>
      <p class="onboarding-text" data-i18n="onboarding.done.text"></p>
    </div>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-icon" src="icon.png" alt="" />
        <span class="brand-name">Ruby</span>
      </div>

      <nav class="mode-switch">
        <button class="mode-switch-btn active" id="mode-chat-btn" data-mode="chat" data-i18n="nav.chat"></button>
        <button class="mode-switch-btn" id="mode-library-btn" data-mode="history" data-i18n="nav.library"></button>
      </nav>

      <div class="topbar-spacer"></div>

      <div class="topbar-right">
        <div class="status">
          <span id="status-dot" class="dot dot-off"></span>
          <span id="status-text" data-i18n="status.disconnected"></span>
        </div>
        <div id="api-key-banner" class="api-banner" style="display:none" data-i18n="status.needsApiKey"></div>
        <button id="help-btn" class="icon-btn-lg" data-i18n-title="topbar.helpTitle"></button>
        <button id="settings-btn" class="icon-btn-lg" data-i18n-title="topbar.settingsTitle"></button>
        <button id="theme-toggle-btn" class="icon-btn-lg" data-i18n-title="topbar.themeTitle"></button>
        <div class="window-controls">
          <button id="win-minimize-btn" class="window-btn" data-i18n-title="topbar.minimizeTitle"></button>
          <button id="win-maximize-btn" class="window-btn" data-i18n-title="topbar.maximizeTitle"></button>
          <button id="win-close-btn" class="window-btn window-btn-close" data-i18n-title="topbar.closeTitle"></button>
        </div>
      </div>
    </header>

    <div class="app-body">
    <aside id="chat-sidebar" class="chat-sidebar">
      <div class="chat-sidebar-head">
        <span data-i18n="chat.sidebarHead"></span>
      </div>
      <button id="chat-sidebar-new-btn" class="ghost-btn chat-sidebar-new-btn"></button>
      <div id="chat-sidebar-list" class="chat-sidebar-list"></div>
    </aside>
    <main>
      <section id="tab-live" class="tab-panel">
        <div class="library-toolbar">
          <button id="live-back-btn" class="icon-btn-lg"></button>
          <h1 id="live-target-label" data-i18n="live.defaultTitle"></h1>
        </div>

        <div id="live-empty-state" class="live-empty-state">
          <div class="setup-card setup-card-highlight setup-card-centered">
            <span class="setup-card-tag" data-i18n="live.offline.tag"></span>
            <h3 data-i18n="live.offline.heading"></h3>
            <p class="setup-card-desc" data-i18n="live.offline.desc"></p>
            <button id="start-mic-btn" class="primary-btn"></button>
            <span id="mic-error" class="hint" style="color:var(--danger)"></span>
          </div>

          <div id="browser-ready-card" class="setup-card setup-card-centered" style="display:none">
            <span class="setup-card-tag" data-i18n="live.online.tag"></span>
            <h3 data-i18n="live.online.heading"></h3>
            <p class="setup-card-desc" data-i18n="live.online.desc"></p>
            <button id="remote-start-slides-btn" class="primary-btn" data-i18n="live.online.startSlides"></button>
            <button id="remote-start-audio-btn" class="secondary-btn" style="margin-top:8px" data-i18n="live.online.startAudioOnly"></button>
            <span id="remote-action-error" class="hint" style="display:none; color:var(--danger); margin-top:8px"></span>
            <p class="hint" style="margin-top:10px" data-i18n="live.online.tabWarning"></p>
          </div>

          <p id="browser-checking-hint" class="hint browser-checking-hint" style="display:none">
            <span class="mini-spinner"></span> <span data-i18n="live.checkingBrowser"></span>
          </p>

          <p id="browser-not-ready-hint" class="hint" style="display:none" data-i18n-html="live.browserNotReady">
          </p>
        </div>

        <div id="live-active-view" class="live-active-view" style="display:none">
          <div class="live-toolbar">
            <button id="attach-slide-btn" class="ghost-btn"></button>
            <div id="slide-preview" class="slide-preview" style="display:none">
              <img id="slide-preview-img" alt="" />
              <span id="slide-preview-time" class="hint"></span>
            </div>
            <div class="toolbar-spacer"></div>
            <span id="live-saved-hint" class="hint" style="display:none; color:var(--success)" data-i18n="live.saved"></span>
            <button id="live-open-note-btn" class="ghost-btn" style="display:none" data-i18n="live.openNote"></button>
            <button id="stop-mic-btn" class="secondary-btn" style="display:none" data-i18n="live.stop"></button>
          </div>
          <div id="live-assignments" class="live-assignments" style="display:none">
            <div class="note-outline-head" data-i18n="assignments.detectedHead"></div>
            <div id="live-assignments-list"></div>
          </div>
          <div class="split">
            <div class="panel">
              <div class="panel-head"><h2 data-i18n="live.transcriptHeading"></h2></div>
              <div id="transcript" class="scroll-box"></div>
            </div>
            <div class="panel">
              <div class="panel-head">
                <h2 data-i18n="live.notesHeading"></h2>
                <button id="copy-btn" class="ghost-btn"></button>
              </div>
              <div id="notes" class="scroll-box notes"></div>
            </div>
          </div>
        </div>
      </section>

      <section id="tab-history" class="tab-panel">
        <div class="library-toolbar">
          <button id="lib-back-btn" class="icon-btn-lg" style="display:none"></button>
          <h1 id="lib-title" data-i18n="library.title"></h1>
          <button id="lib-chat-btn" class="ghost-btn" style="display:none"></button>
          <div class="toolbar-spacer"></div>
          <div class="search-box">
            <span id="search-icon"></span>
            <input id="search-input" type="search" data-i18n-placeholder="library.searchPlaceholder" />
          </div>
        </div>
        <div id="library-content" class="library-content"></div>
      </section>

      <section id="tab-chat" class="tab-panel active">
        <div class="library-toolbar">
          <button id="chat-back-btn" class="icon-btn-lg"></button>
          <h1 id="chat-title" data-i18n="chat.defaultTitle"></h1>
        </div>
        <div id="chat-thread-view">
          <div id="chat-messages" class="chat-messages"></div>
          <div class="chat-input-row">
            <input id="chat-input" type="text" data-i18n-placeholder="chat.inputPlaceholder" />
            <button id="chat-send-btn" class="primary-btn" data-i18n="chat.send"></button>
          </div>
        </div>
      </section>

      <section id="tab-settings" class="tab-panel">
        <div class="library-toolbar">
          <button id="settings-back-btn" class="icon-btn-lg"></button>
          <h1 class="page-title" data-i18n="settings.title"></h1>
        </div>
        <form id="settings-form" class="settings-form">
          <fieldset>
            <legend data-i18n="settings.language.legend"></legend>
            <p class="hint" data-i18n="settings.language.hint"></p>
            <label>
              <select id="ui-language-select">
                <option value="ru">Русский</option>
                <option value="en">English</option>
              </select>
            </label>
          </fieldset>

          <fieldset>
            <legend>Gemini API</legend>
            <p class="hint" data-i18n-html="settings.gemini.hint"></p>
            <div class="api-key-row">
              <input id="api-key-input" type="password" data-i18n-placeholder="settings.gemini.inputPlaceholder" />
              <button id="save-api-key-btn" type="button" class="secondary-btn" data-i18n="common.save"></button>
            </div>
            <span id="api-key-status" class="hint"></span>
          </fieldset>

          <fieldset>
            <legend data-i18n="settings.groq.legend"></legend>
            <p class="hint" data-i18n-html="settings.groq.hint"></p>
            <div class="api-key-row">
              <input id="groq-key-input" type="password" data-i18n-placeholder="settings.groq.inputPlaceholder" />
              <button id="save-groq-key-btn" type="button" class="secondary-btn" data-i18n="common.save"></button>
              <button id="clear-groq-key-btn" type="button" class="ghost-btn" data-i18n="common.remove"></button>
            </div>
            <span id="groq-key-status" class="hint"></span>
          </fieldset>

          <fieldset>
            <legend data-i18n="settings.storage.legend"></legend>
            <p class="hint" data-i18n="settings.storage.hint"></p>
            <div class="api-key-row">
              <input id="library-path-input" type="text" readonly />
              <button id="choose-folder-btn" type="button" class="secondary-btn" data-i18n="common.change"></button>
              <button id="reveal-folder-btn" type="button" class="secondary-btn" data-i18n="settings.storage.openFolder"></button>
            </div>
          </fieldset>

          <fieldset>
            <legend data-i18n="settings.capture.legend"></legend>
            <label>
              <span data-i18n="settings.capture.slideInterval"></span>
              <input type="number" name="slideIntervalSec" min="5" max="120" />
            </label>
            <label>
              <span data-i18n="settings.capture.hotkey"></span>
              <input type="text" name="toggleHotkey" />
            </label>
          </fieldset>

          <fieldset>
            <legend data-i18n="settings.callOut.legend"></legend>
            <p class="hint" data-i18n="settings.callOut.hint"></p>
            <label>
              <span data-i18n="settings.callOut.label"></span>
              <input type="text" name="callOutName" data-i18n-placeholder="settings.callOut.placeholder" />
            </label>
          </fieldset>

          <fieldset>
            <legend data-i18n="settings.marker.legend"></legend>
            <p class="hint" data-i18n="settings.marker.hint"></p>
            <label>
              <span data-i18n="settings.marker.label"></span>
              <input type="text" name="markerPhrase" data-i18n-placeholder="settings.marker.placeholder" />
            </label>
          </fieldset>

          <fieldset>
            <legend data-i18n="settings.detail.legend"></legend>
            <p class="hint" data-i18n="settings.detail.hint"></p>
            <label>
              <select name="notesDetailLevel">
                <option value="concise" data-i18n="settings.detail.concise"></option>
                <option value="detailed" data-i18n="settings.detail.detailed"></option>
              </select>
            </label>
          </fieldset>

          <button type="submit" class="primary-btn" data-i18n="common.save"></button>
          <span id="settings-saved" class="hint"></span>
        </form>
      </section>
    </main>
    </div>
  </div>

  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <h3 id="modal-title"></h3>
      <p id="modal-message" class="hint"></p>
      <input id="modal-input" type="text" />
      <div class="modal-actions">
        <button id="modal-cancel-btn" class="ghost-btn" data-i18n="common.cancel"></button>
        <button id="modal-ok-btn" class="primary-btn" data-i18n="common.ok"></button>
      </div>
    </div>
  </div>

  <div id="help-modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal-box modal-box-wide">
      <div class="modal-box-head">
        <h3 data-i18n="help.title"></h3>
        <button id="help-close-btn" class="icon-btn-lg"></button>
      </div>
      <p class="hint" data-i18n="help.intro"></p>

      <div class="setup-step">
        <span class="setup-step-num">1</span>
        <div>
          <p data-i18n="help.step1"></p>
          <button id="copy-chrome-url-btn" class="secondary-btn" data-i18n="help.step1Btn"></button>
        </div>
      </div>
      <div class="setup-step">
        <span class="setup-step-num">2</span>
        <p data-i18n-html="help.step2"></p>
      </div>
      <div class="setup-step">
        <span class="setup-step-num">3</span>
        <div>
          <p data-i18n-html="help.step3"></p>
          <button id="open-extension-folder-btn" class="secondary-btn" data-i18n="help.step3Btn"></button>
        </div>
      </div>

      <p class="hint" style="margin-top:14px" data-i18n-html="help.everyTime"></p>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
